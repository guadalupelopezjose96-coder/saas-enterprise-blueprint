name: Enterprise SaaS DevSecOps Pipeline (SLSA Level 3 + SBOM + Cosign + 55/55 Controls)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  security-compliance-and-license-gate:
    name: "Gate 1: Auditoria de 55/55 Controles, 36 Fases, Licencia Comercial, Merkle RFC 6962, DLP y Go Fuzz/Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Inmutable del Codigo Fuente
        uses: actions/checkout@v4

      - name: Configurar Entorno Go (ISO 8.29)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Ejecutar Suite de Pruebas Unitarias y Semillas de Fuzzing en Go
        run: go test -v -race ./cmd/api/...

      - name: Ejecutar Escaner DLP Anti-Secretos (ISO 27001 A.8.12 - Control SEC-01)
        run: |
          chmod +x security/06_zero_secret_leakage_scanner.sh
          ./security/06_zero_secret_leakage_scanner.sh

      - name: Verificar Raiz Criptografica del Arbol de Merkle RFC 6962 (Control MRK-01)
        run: python3 security/05_rfc6962_merkle_tree_transparency_log.py

      - name: Ejecutar Auditoria Maestra de los 55/55 Controles y 36 Fases del Ciclo de Vida
        run: |
          chmod +x verify_compliance_posture.sh
          ./verify_compliance_posture.sh

      - name: Instalar Trivy Oficial
        uses: aquasecurity/setup-trivy@v0.2.2

      - name: Escaneo de Vulnerabilidades y Secretos (SAST / SCA)
        run: trivy fs --scanners vuln,secret,misconfig --exit-code 0 --severity CRITICAL,HIGH .

      - name: Auditoria Legal de Licencias Open Source (Bloqueo Estricto de AGPL/GPL/SSPL)
        run: |
          if grep -riE "AGPL|GPL-3|SSPL" go.mod 2>/dev/null; then
            echo "::error::VIOLACION DE PROPIEDAD INTELECTUAL: Licencia viral detectada."
            exit 1
          fi
          echo "Auditoria de licencias superada: 0 dependencias virales."

  build-sbom-and-cosign-attestation:
    name: "Gate 2: Compilacion Distroless, SBOM Dual (CycloneDX + SPDX 2.3) y Firma Sigstore Cosign"
    needs: security-compliance-and-license-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Codigo
        uses: actions/checkout@v4

      - name: Instalar Sigstore Cosign Oficial
        uses: sigstore/cosign-installer@v3.7.0

      - name: Instalar Anchore Syft para Generacion de SBOM
        uses: anchore/sbom-action/download-syft@v0.17.2

      - name: Compilar Imagen Inmutable Distroless y Generar SBOM CycloneDX + SPDX
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/saas-api-service:${{ github.sha }} .
          syft ghcr.io/${{ github.repository_owner }}/saas-api-service:${{ github.sha }} -o cyclonedx-json > sbom.cdx.json

      - name: Firmar Artefacto y Atestacion SBOM con Sigstore Cosign (Keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes --output-signature sbom.cdx.json.sig --output-certificate sbom.cdx.json.pem sbom.cdx.json
