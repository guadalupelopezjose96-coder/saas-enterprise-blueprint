# =============================================================================
# PERFIL CRIPTOGRAFICO POST-CUANTICO HIBRIDO (NIST FIPS 203 ML-KEM / CNSA 2.0)
# Mitigacion contra ataques "Harvest Now, Decrypt Later" (HNDL) | Control PQC-01
# =============================================================================

ssl_protocols TLSv1.3;
ssl_prefer_server_ciphers on;

# Intercambio de claves hibrido Post-Cuantico (NIST FIPS 203 ML-KEM-768 + X25519)
ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;

# Suites de cifrado autenticadas AEAD de 256 bits (FIPS 140-3 Level 3)
ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

# Cabeceras de aislamiento estricto y transporte seguro (HSTS 2 anos + preload)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
