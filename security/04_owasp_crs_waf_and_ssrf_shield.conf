# =============================================================================
# ESCUDO PERIMETRAL WAF OWASP CRS 4.0 Y MITIGACION SSRF IMDSv2 (ISO 27001 A.8.21)
# Bloqueo matematico de SSRF (169.254.169.254), SQLi, XSS y Path Traversal
# =============================================================================

client_max_body_size 64k;
client_body_timeout 10s;
client_header_timeout 10s;

# Bloqueo estricto de intentos de Server-Side Request Forgery (SSRF) hacia metadatos Cloud
if ($request_uri ~* "(169\.254\.169\.254|metadata\.google\.internal|\.\./)") {
    return 403;
}

add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
